<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for authentic brand gradients and filters -->
  <defs>
    <style>
      .navy-stroke { stroke: #193555; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .cyan-stroke { stroke: #088AC3; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .medium-stroke { stroke: #355D7F; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .horizon-fill { fill: url(#horizonGrad); }
      .ar-title { font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif; font-weight: 800; fill: #193555; font-size: 38px; text-anchor: middle; letter-spacing: -0.5px; }
      .ar-subtitle { font-family: 'Cairo', 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #088AC3; font-size: 26px; text-anchor: middle; letter-spacing: 0.5px; }
    </style>
    <linearGradient id="horizonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#193555" />
      <stop offset="50%" stopColor="#355D7F" />
      <stop offset="100%" stopColor="#193555" />
    </linearGradient>
  </defs>

  <!-- 1. The House on Left -->
  <!-- Chimney -->
  <path d="M 185 246 L 185 227 L 195 227 L 195 237" class="navy-stroke" />

  <!-- Roof slope: Left edge -> Peak -> Right slope -->
  <path d="M 138 270 L 212 228 L 282 272" class="navy-stroke" />

  <!-- 4-Pane Cyan Window -->
  <g transform="translate(202, 246)">
    <!-- 4 cyan squares -->
    <rect x="0" y="0" width="8.5" height="8.5" rx="0.5" fill="#088AC3" />
    <rect x="10.5" y="0" width="8.5" height="8.5" rx="0.5" fill="#088AC3" />
    <rect x="0" y="10.5" width="8.5" height="8.5" rx="0.5" fill="#088AC3" />
    <rect x="10.5" y="10.5" width="8.5" height="8.5" rx="0.5" fill="#088AC3" />
  </g>

  <!-- 2. The Skyscraper Cluster on Right -->
  <!-- Building 1 (Far left slim angled tower) -->
  <path d="M 260 258 L 260 226 L 274 216 L 274 268" class="navy-stroke" />

  <!-- Building 2 (Tallest rear navy skyscraper) -->
  <path d="M 281 268 L 281 120 L 316 120 L 316 268" class="navy-stroke" />

  <!-- Building 3 (Prominent main cyan skyscraper) -->
  <path d="M 300 268 L 300 156 L 343 156 L 343 268" class="cyan-stroke" />

  <!-- Building 4 (Lower stepped cyan skyscraper) -->
  <path d="M 348 268 L 348 212 L 368 212 L 368 276" class="cyan-stroke" />

  <!-- 3. Curved Horizon Swoosh Base -->
  <path d="M 98 301 C 180 278 320 278 402 301 C 320 286 180 286 98 301 Z" class="horizon-fill" />

  <!-- 4. Typography directly matching the original uploaded logo -->
  <text x="250" y="338" class="ar-title">مكتب انوار نجد</text>
  <text x="250" y="375" class="ar-subtitle">للخدمات العقارية</text>
</svg>
